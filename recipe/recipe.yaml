context:
  version: "22.1.0"

package:
  name: cargo-update
  version: ${{ version }}

source:
  url: https://github.com/nabijaczleweli/cargo-update/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 0e627270c963403ee1157c8dcb1679f779e261aaa4c23ccd9693fabaa5400509

build:
  number: 0
  script:
    env:
      AWS_LC_SYS_CMAKE_BUILDER: ${{ "1" if win else "0" }} # force CMake builder for `aws-lc-sys` native C/C++ code on Windows
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
      OPENSSL_DIR: $PREFIX # force using host's (conda-forge's) OpenSSL lib dir (on Unix)
      OPENSSL_NO_VENDOR: "1" # force linking to host's (conda-forge's) OpenSSL libs (on Unix)
      # instruct `cc` crate to use clang-cl natively to compile build-time tools intended to be run on the host when cross-compiling from `win_64`
      AR_x86_64_pc_windows_msvc: llvm-lib
      CC_x86_64_pc_windows_msvc: clang-cl
      CXX_x86_64_pc_windows_msvc: clang-cl
    content:
      # NOTE: we cannot use `--locked` in `cargo install` since the upstream project has no `Cargo.lock` committed
      - if: unix
        then:
          - cargo auditable install --path=. --root="$PREFIX" --no-track --bins
      - if: win
        then:
          - cargo auditable install --path=. --root="%LIBRARY_PREFIX%" --no-track --bins
      - cargo-bundle-licenses --format=yaml --output=./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - if: win
      then: cmake
  host:
    - if: unix
      then:
        - libgit2
        - openssl
        - pkg-config
  run:
    - if: linux
      then: libsecret

tests:
  - script:
      - cargo-install-update --help
      - cargo-install-update --version
      - cargo-install-update-config --help
      - cargo-install-update-config --version
  - package_contents:
      bin:
        - cargo-install-update
        - cargo-install-update-config
      strict: true

about:
  summary: A cargo subcommand for checking and applying updates to installed executables
  description: |
    cargo-update provides the `cargo install-update` subcommand for cargo,
    allowing you to check for and apply updates to all installed cargo binaries.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/nabijaczleweli/cargo-update
  documentation: https://github.com/nabijaczleweli/cargo-update/tree/master/man
  repository: https://github.com/nabijaczleweli/cargo-update

extra:
  recipe-maintainers:
    - salim-b
